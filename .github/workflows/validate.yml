name: Validate plugins
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pinned so a new Claude Code release cannot change the verdict on an unchanged commit.
      - run: npm install -g @anthropic-ai/claude-code@2.1.319
      - name: Claude Code marketplace
        run: claude plugin validate . --strict
      - name: Claude Code plugin, with the directory's checks
        run: claude plugin validate ./claude/clustercontrol-mcp --strict --profile directory
      - name: Cross-tool consistency
        run: python3 tools/check-manifests.py
      - name: Consistency checker catches planted defects
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin's README promises Node.js 18 or later.
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Bridge tests
        run: node --test tools/bridge.test.mjs
